name: Experiment 4 CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r app/requirements.txt
          python -m pip install pytest pyyaml

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t experiment4-app:${{ github.sha }} .

      - name: Validate Kubernetes manifests
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          for path in sorted(Path("k8s").glob("*.yaml")):
              with path.open(encoding="utf-8") as file:
                  doc = yaml.safe_load(file)
              assert isinstance(doc, dict), f"{path} is not a YAML object"
              for key in ("apiVersion", "kind", "metadata", "spec"):
                  assert key in doc, f"{path}: missing {key}"
              print(f"PASS: {path} ({doc['kind']})")
          PY
